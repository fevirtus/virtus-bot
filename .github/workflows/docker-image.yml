name: Test and publish bot

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install uv && uv sync --locked
      - name: Bot and health regression
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Legacy optional dependency
        run: uv run --frozen python -c 'from thefuzz import fuzz; assert fuzz.ratio("virtus", "virtus") == 100'
      - run: uv run --frozen python -m compileall -q bot services models infra web main.py

  publish:
    needs: test
    permissions:
      contents: read
      packages: write
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable release
        run: docker build --label org.opencontainers.image.source=https://github.com/fevirtus/virtus-bot -t ghcr.io/fevirtus/virtus-bot:sha-${{ github.sha }} -t ghcr.io/fevirtus/virtus-bot:latest .
      - name: Publish
        run: |
          docker push ghcr.io/fevirtus/virtus-bot:sha-${{ github.sha }}
          docker push ghcr.io/fevirtus/virtus-bot:latest

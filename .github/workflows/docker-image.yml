name: Test and publish bot

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: virtus_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: virtus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U virtus_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install uv && uv sync --frozen
      - name: Engine, Discord adapter and PostgreSQL transactions
        env:
          CULTIVATION_TEST_DATABASE_URL: postgresql+asyncpg://virtus_test:test_only@localhost:5432/virtus_test
        run: uv run python -m unittest discover -s tests -v
      - name: Historical model regression
        run: uv run python -m unittest discover -s scripts -p 'test_game_balance.py' -v
      - run: uv run python -m compileall -q bot services models infra web main.py

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build immutable release
        run: docker build -t fevirtus/virtus-bot:sha-${{ github.sha }} -t fevirtus/virtus-bot:latest .
      - name: Publish
        run: |
          docker push fevirtus/virtus-bot:sha-${{ github.sha }}
          docker push fevirtus/virtus-bot:latest
